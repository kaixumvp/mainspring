name: Release

# 发布路径：推 tag → 构建 sdist+wheel → twine check → 跑一遍测试 → 可信发布（OIDC，仓库内不存任何 token）。
# 一次性准备：在 PyPI 项目页 "Publishing → Trusted Publisher" 里登记
#   provider=GitHub，owner=kaixumvp，repository=mainspring，pattern=`.github/workflows/release.yml`。
# 若坚持用 API token，把 publish 步骤换成 `password: ${{ secrets.PYPI_TOKEN }}`（token 只进 Actions secret，
# 不要写进 ~/.pypirc 明文）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              sys.exit(f"refusing to release: tag {tag} != pyproject version v{version}")
          PY
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test before publish (py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all]" pytest pytest-asyncio
      - run: python -m pytest -q -p no:cacheprovider

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
