<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mainspring dev · DevUI</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff; --ok: #3fb96f;
    --warn: #e0a83c; --err: #e05c5c; --mono: "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .badge {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px;
  }
  #status { margin-left: auto; font-size: 13px; color: var(--muted); }
  #status.running { color: var(--accent); }
  #status.awaiting_human { color: var(--warn); }
  #status.completed { color: var(--ok); }
  #status.failed { color: var(--err); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; min-width: 0;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  #controls { display: flex; gap: 8px; margin-bottom: 14px; }
  #task {
    flex: 1; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font: 13px/1.5 var(--mono);
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  .step {
    display: flex; gap: 10px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: 8px; background: var(--panel-2);
  }
  .step .node {
    font-family: var(--mono); font-size: 12px; min-width: 58px; color: var(--accent);
    text-transform: uppercase;
  }
  .step .body { flex: 1; min-width: 0; }
  .step .action { font-family: var(--mono); font-size: 13px; }
  .step .out { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; max-height: 96px; overflow-y: auto; }
  .step .meta { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .step.awaiting { border-color: var(--warn); }
  .step .node.execute { color: var(--warn); }
  .step .node.observe { color: var(--ok); }
  #deltas {
    font-family: var(--mono); font-size: 13px; white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 420px; overflow-y: auto;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; min-height: 120px;
  }
  #deltas .seq-tag { color: var(--muted); font-size: 11px; }
  #deltas .cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #approval {
    display: none; border: 1px solid var(--warn); border-radius: 8px;
    background: rgba(224, 168, 60, .08); padding: 12px 14px; margin-bottom: 14px;
  }
  #approval h3 { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
  #approval ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; }
  #approval li { font-family: var(--mono); }
  #trace {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    max-height: 420px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #final { font-size: 14px; padding: 10px 12px; border-radius: 6px; background: var(--panel-2); display: none; }
  #usage { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 8px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>mainspring dev</h1>
  <span class="badge" id="addr">…</span>
  <span id="status">空闲</span>
</header>
<main>
  <section class="card">
    <h2>运行</h2>
    <div id="controls">
      <input id="task" value="计算 123×45，然后把 100 元转给 alice。">
      <button id="run-btn" onclick="startRun()">运行</button>
      <button id="reset-btn" class="secondary" onclick="resetUI()">重置</button>
    </div>
    <div id="approval">
      <h3>需要人工审批</h3>
      <ul id="approval-list"></ul>
      <button onclick="approveAll()">批准全部</button>
    </div>
    <div id="steps"><div class="empty">点击「运行」开始 — 步骤时间线将显示在这里。</div></div>
  </section>
  <section class="card">
    <h2>实时输出（message.delta）</h2>
    <div id="deltas"><span class="empty">…</span></div>
    <div id="final"></div>
    <div id="usage"></div>
  </section>
  <section class="card" style="grid-column: 1 / -1;">
    <h2>事件追踪（原始 RuntimeEvent）</h2>
    <div id="trace"></div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let pendingApprovals = [];
let currentRunId = null;
let currentSeq = -1;

function setStatus(text, cls) {
  $("status").textContent = text;
  $("status").className = cls || "";
}

function addStep(e) {
  const d = e.data || {};
  const out = d.output ? JSON.stringify(d.output, null, 0) : "";
  const awaiting = d.node === "execute" && out.includes("approval required");
  const isFinish = d.action === "__finish__";
  const div = document.createElement("div");
  div.className = "step" + (awaiting ? " awaiting" : "");
  const latency = d.latency_ms != null ? ` · ${d.latency_ms}ms` : "";
  const args = !isFinish && d.output && d.output.action_input != null
    ? `(${esc(JSON.stringify(d.output.action_input))})` : "";
  div.innerHTML =
    `<span class="node">${d.node || ""}</span>` +
    `<div class="body">` +
      (d.action ? `<div class="action">${esc(isFinish ? "finish" : d.action)}${args}</div>` : "") +
      (d.node !== "decide" && out ? `<div class="out">${esc(out)}</div>` : "") +
      (isFinish && d.output && d.output.result ? `<div class="out">${esc(d.output.result)}</div>` : "") +
      `<div class="meta">seq=${d.seq}${latency}</div>` +
    `</div>`;
  $("steps").appendChild(div);
}

function appendDelta(d) {
  const box = $("deltas");
  if (box.dataset.empty === "1") { box.innerHTML = ""; delete box.dataset.empty; }
  if (d.seq !== currentSeq) {
    currentSeq = d.seq;
    box.appendChild(document.createTextNode("\n"));
    const tag = document.createElement("span");
    tag.className = "seq-tag";
    tag.textContent = `[decide #${d.seq}] `;
    box.appendChild(tag);
  }
  box.appendChild(document.createTextNode(d.delta || ""));
  box.scrollTop = box.scrollHeight;
}

function showApproval(pending) {
  pendingApprovals = pending || [];
  const ul = $("approval-list");
  ul.innerHTML = "";
  pendingApprovals.forEach(p => {
    const li = document.createElement("li");
    li.textContent = `${p.action} → ${p.resource_type}:${p.resource_id}`;
    ul.appendChild(li);
  });
  $("approval").style.display = "block";
}

function addTrace(e) {
  const t = $("trace");
  if (t.dataset.empty === "1") { t.textContent = ""; delete t.dataset.empty; }
  t.textContent += JSON.stringify(e) + "\n";
}

function handleEvent(e) {
  addTrace(e);
  switch (e.event) {
    case "run.started":
      currentRunId = e.run_id;
      setStatus("运行中", "running");
      break;
    case "step.completed":
      addStep(e);
      break;
    case "message.delta":
      appendDelta(e.data || {});
      break;
    case "run.awaiting_human":
      setStatus("等待人工审批", "awaiting_human");
      showApproval((e.data || {}).pending_approvals || []);
      break;
    case "run.approved":
      setStatus("已批准，继续运行", "running");
      $("approval").style.display = "none";
      break;
    case "run.completed": {
      setStatus("完成", "completed");
      const d = e.data || {};
      if (d.result) {
        const f = $("final");
        f.style.display = "block";
        f.textContent = "结果：" + d.result;
      }
      if (d.usage) {
        $("usage").textContent =
          `tokens: prompt=${d.usage.prompt_tokens} completion=${d.usage.completion_tokens} total=${d.usage.total_tokens}`;
      }
      break;
    }
    case "run.failed":
      setStatus("失败：" + ((e.data || {}).error || "?"), "failed");
      break;
  }
}

async function startRun() {
  resetUI();
  $("steps").innerHTML = `<div class="empty">运行中…</div>`;
  $("run-btn").disabled = true;
  const task = $("task").value.trim() || undefined;
  try {
    const resp = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task }),
    });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || resp.status);
    // SSE usually wins the race; use the HTTP result as the authoritative fallback.
    if (result.status === "awaiting_human") {
      setStatus("等待人工审批", "awaiting_human");
      showApproval(result.pending_approvals || []);
      currentRunId = result.run_id || currentRunId;
    } else if (result.status === "completed") {
      setStatus("完成", "completed");
      if (result.result) {
        const f = $("final");
        f.style.display = "block";
        f.textContent = "结果：" + result.result;
      }
    } else if (result.status === "failed") {
      setStatus("失败：" + (result.error || "?"), "failed");
    }
  } catch (err) {
    setStatus("请求失败：" + err.message, "failed");
  } finally {
    $("run-btn").disabled = false;
  }
}

async function approveAll() {
  if (!currentRunId) return;
  const approvals = pendingApprovals.map(p => p.resource_id);
  try {
    const resp = await fetch("/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ run_id: currentRunId, approvals }),
    });
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || resp.status);
    if (result.status === "completed") {
      setStatus("完成", "completed");
      if (result.result) {
        const f = $("final");
        f.style.display = "block";
        f.textContent = "结果：" + result.result;
      }
    } else if (result.status === "failed") {
      setStatus("失败：" + (result.error || "?"), "failed");
    }
  } catch (err) {
    setStatus("审批请求失败：" + err.message, "failed");
  }
}

function resetUI() {
  $("steps").innerHTML = `<div class="empty">点击「运行」开始 — 步骤时间线将显示在这里。</div>`;
  $("deltas").innerHTML = `<span class="empty">…</span>`;
  $("deltas").dataset.empty = "1";
  $("final").style.display = "none";
  $("final").textContent = "";
  $("usage").textContent = "";
  $("trace").textContent = "";
  $("trace").dataset.empty = "1";
  $("approval").style.display = "none";
  pendingApprovals = [];
  currentRunId = null;
  currentSeq = -1;
  setStatus("空闲");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function connect() {
  window._es = new EventSource("/events");  // global ref: a GC'd EventSource closes silently
  window._es.onmessage = msg => { try { handleEvent(JSON.parse(msg.data)); } catch (e) {} };
  window._es.onerror = () => { /* EventSource auto-reconnects; pings keep the link warm */ };
}
$("addr").textContent = location.host;
connect();
resetUI();
</script>
</body>
</html>
