[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "mainspring"
version = "3.6.0"
description = "Mainspring: a business-agnostic agent runtime (Plan → Decide → Execute → Observe loop) with plugins, skills, tools, and memory."
readme = "README.md"
license = "MIT"
packages = [{ include = "mainspring" }]
include = [{ path = "mainspring/devui/static/index.html" }]
keywords = ["agent", "llm", "framework", "plugins", "skills", "tools", "memory"]
repository = "https://github.com/kaixumvp/mainspring"
homepage = "https://github.com/kaixumvp/mainspring"

[tool.poetry.dependencies]
python = ">=3.11"
pydantic = ">=2.6"
litellm = { version = ">=1.40", optional = true }
httpx = { version = ">=0.27", optional = true }
redis = { version = ">=5.0", optional = true }
opentelemetry-api = { version = ">=1.20", optional = true }

[tool.poetry.scripts]
mainspring = "mainspring.cli:main"

[tool.poetry.extras]
litellm = ["litellm"]
http = ["httpx"]
redis = ["redis"]
all = ["litellm", "httpx", "redis", "opentelemetry-api"]
observability = ["opentelemetry-api"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
ruff = ">=0.6"
mypy = ">=1.11"
build = ">=1.2"
twine = ">=5.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-7s %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["dist", "documentation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
  "RUF001",  # 文档与注释是中文，全角标点是预期写法，不是 confusable
  "RUF002",
  "RUF003",
  "RUF012",  # 工具类的 parameters 是类级默认值，子类覆盖或实例整体赋值，不原地修改
  "UP042",   # PermissionDecision 保持 (str, Enum)：公共 API 自 1.0 冻结，StrEnum 改变 str() 语义
]

[tool.ruff.lint.per-file-ignores]
"mainspring/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["mainspring"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mainspring.tools.builtin.*"
# 内置工具的 run 用显式命名参数（expression/url），调用侧统一按 **kwargs 分发，
# 因而与 BaseTool.run(**kwargs) 抽象签名在类型层面不可互换；实际契约由 parameters schema 保证
disable_error_code = ["override"]
